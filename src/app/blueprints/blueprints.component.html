

<div class="container-fluid px-5 py-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-semibold mb-1">Blueprints</h2>
      <p class="text-muted mb-0">Manage your contract templates</p>
    </div>

    <button
      type="button"
      class="btn btn-primary"
      (click)="openCreateBlueprint()"
    >
      <i class="bi bi-plus-lg me-1"></i>
      Create Blueprint
    </button>
  </div>

  <!-- SEARCH -->
  <div class="card mb-4">
    <div class="card-body">
      <input
        type="text"
        class="form-control"
        placeholder="Search blueprints..."
      />
    </div>
  </div>

  <!-- 🔹 BLUEPRINT CARDS -->
  <div class="row" *ngIf="blueprints.length > 0">

    <div
      class="col-md-4 mb-4"
      *ngFor="let blueprint of blueprints"
    >
      <div class="card h-100">
        <div class="card-body d-flex flex-column">

          <h5 class="fw-semibold mb-1">
            {{ blueprint.name }}
          </h5>

          <p class="text-muted small mb-3">
            {{ blueprint.description }}
          </p>

          <div class="mt-auto">
            <p class="mb-1 text-muted small">
              Fields: {{ blueprint.fields?.length || 0 }}
            </p>
            <p class="mb-3 text-muted small">
              Created: {{ blueprint.createdAt }}
            </p>

            <div class="d-flex gap-2">
           <button
  class="btn btn-outline-secondary btn-sm w-50"
  (click)="viewBlueprint(blueprint.id)"
>
  View
</button>
              <button class="btn btn-outline-primary btn-sm w-50">
                Use
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

  <!-- 🔹 EMPTY STATE -->
  <div class="card" *ngIf="blueprints.length === 0">
    <div class="card-body text-center py-5">

      <i class="bi bi-file-earmark-text text-muted fs-1 mb-3"></i>

      <h5 class="fw-semibold mb-1">No blueprints yet</h5>
      <p class="text-muted mb-4">
        Create your first blueprint to get started with contract management
      </p>

      <button
        type="button"
        class="btn btn-primary w-100 py-3"
        (click)="openCreateBlueprint()"
      >
        <i class="bi bi-plus-lg me-2"></i>
        Create Blueprint
      </button>

    </div>
  </div>

</div>
